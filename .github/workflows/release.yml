name: Build & GitHub Release (Ultra-Slim Small Setup Installer Only)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g. v4.47.0)'
        required: false
        default: 'v4.47.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Ultra-Slim Small Windows Setup Installer (~8MB WinPurifyPro-Setup.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (8.0 LTS)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify & Sync Versions Across Project
        run: node sync-version.js

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Prepare Build & Output Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "publish/App" -Force | Out-Null
          New-Item -ItemType Directory -Path "publish/Commander" -Force | Out-Null
          New-Item -ItemType Directory -Path "Output" -Force | Out-Null

      - name: Build Ultra-Slim Framework-Dependent App & Compile Small Installer
        shell: pwsh
        run: |
          Write-Host "==========================================================" -ForegroundColor Cyan
          Write-Host " Building Ultra-Slim Small Installer (~8MB WinPurifyPro-Setup.exe)" -ForegroundColor Green
          Write-Host "==========================================================" -ForegroundColor Cyan

          # 1. Publish Ultra-Slim App & Commander (--self-contained false for ~8MB package)
          dotnet publish WinPurifyPro.csproj -c Release -f net8.0-windows -r win-x64 --self-contained false -p:PublishSingleFile=false -p:DebugType=none -p:DebugSymbols=false -o publish/App
          dotnet publish WinPurifyCommander.csproj -c Release -f net8.0-windows -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o publish/Commander

          # 2. Copy core assets & Commander into publish/App
          @("PurifyEngineCore.dll", "WinPurify.ico", "WinPurify_logo.png", "WinPurify_icon.png", "LICENSE_KO.txt", "LICENSE_EN.txt") | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ -Destination "publish/App/" -Force }
          }
          if (Test-Path "publish/Commander/WinPurifyCommander.exe") {
            Copy-Item "publish/Commander/WinPurifyCommander.exe" -Destination "publish/App/WinPurifyCommander.exe" -Force
          }

          # 3. Compile Small Official Installer (LZMA2 Ultra Compression)
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          
          Write-Host "[+] Compiling Ultra-Slim Small Installer: Output/WinPurifyPro-Setup.exe" -ForegroundColor Yellow
          & $iscc /DAppSourceDir="publish\App" /DOutputDir="Output" /DOutputBaseFilename="WinPurifyPro-Setup" installer.iss

      - name: Verify Small Installer Size
        shell: pwsh
        run: |
          Write-Host "`n==========================================================" -ForegroundColor Green
          Write-Host " [SUCCESS] Ultra-Slim Small Installer Generated in Output/:" -ForegroundColor Green
          Write-Host "==========================================================" -ForegroundColor Green
          Get-ChildItem -Path "Output" | Select-Object Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length / 1MB, 2)}}, LastWriteTime | Format-Table -AutoSize

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: Output/WinPurifyPro-Setup.exe

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Release Notes from PATCH_NOTES.md
        id: release_notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT
          python3 -c "
          import re
          with open('docs/PATCH_NOTES.md', 'r', encoding='utf-8') as f:
              content = f.read()
          match = re.search(r'(## 📌 \[v.*?\][\s\S]*?)(?=\n---\n|## 📌|\Z)', content)
          notes = match.group(1).strip() if match else 'WinPurify Pro automated build release'
          with open('RELEASE_BODY.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          "

      - name: Create GitHub Release (Ultra-Slim WinPurifyPro-Setup.exe Only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_notes.outputs.tag_name }}
          name: WinPurify Pro ${{ steps.release_notes.outputs.tag_name }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          files: release-assets/WinPurifyPro-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
