name: Build & GitHub Release (PC Windows)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g. v4.40.0)'
        required: false
        default: 'v4.40.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows PC Installer & Portable (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (8.0)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js for Version Verification
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify & Sync Versions Across Project
        run: node sync-version.js

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Prepare Output and Publish Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "publish/App" -Force | Out-Null
          New-Item -ItemType Directory -Path "publish/Commander" -Force | Out-Null
          New-Item -ItemType Directory -Path "Output" -Force | Out-Null

      - name: Build & Publish WinPurifyPro (net8.0-windows win-x64)
        shell: pwsh
        run: |
          Write-Host "[+] Publishing WinPurify Pro App..." -ForegroundColor Cyan
          dotnet publish WinPurifyPro.csproj -c Release -f net8.0-windows -r win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishReadyToRun=false -o publish/App

          Write-Host "[+] Publishing WinPurify Commander Console..." -ForegroundColor Cyan
          dotnet publish WinPurifyCommander.csproj -c Release -f net8.0-windows -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=false -o publish/Commander

          # Copy core assets into publish/App and Output
          if (Test-Path "PurifyEngineCore.dll") { Copy-Item "PurifyEngineCore.dll" -Destination "publish/App/" -Force }
          if (Test-Path "WinPurify.ico") { Copy-Item "WinPurify.ico" -Destination "publish/App/" -Force }
          if (Test-Path "WinPurify_logo.png") { Copy-Item "WinPurify_logo.png" -Destination "publish/App/" -Force }
          if (Test-Path "WinPurify_icon.png") { Copy-Item "WinPurify_icon.png" -Destination "publish/App/" -Force }
          if (Test-Path "LICENSE_KO.txt") { Copy-Item "LICENSE_KO.txt" -Destination "publish/App/" -Force }
          if (Test-Path "LICENSE_EN.txt") { Copy-Item "LICENSE_EN.txt" -Destination "publish/App/" -Force }
          if (Test-Path "publish/Commander/WinPurifyCommander.exe") { 
            Copy-Item "publish/Commander/WinPurifyCommander.exe" -Destination "publish/App/WinPurifyCommander.exe" -Force
            Copy-Item "publish/Commander/WinPurifyCommander.exe" -Destination "Output/WinPurifyCommander.exe" -Force
          }

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          Write-Host "[+] Compiling Inno Setup with ISCC at: $iscc" -ForegroundColor Yellow
          & $iscc /DAppSourceDir="publish\App" /DOutputDir="Output" /DOutputBaseFilename="WinPurifyPro-Setup" installer.iss
          Get-ChildItem -Path "Output"

      - name: Create Portable Zip Package
        shell: pwsh
        run: |
          Write-Host "[+] Creating Portable Zip Package..." -ForegroundColor Cyan
          Compress-Archive -Path "publish/App/*" -DestinationPath "Output/WinPurifyPro-Portable-x64.zip" -Force
          Get-ChildItem -Path "Output"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: Output/*

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets

      - name: Extract Release Notes from PATCH_NOTES.md
        id: release_notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT
          python3 -c "
          import re
          with open('docs/PATCH_NOTES.md', 'r', encoding='utf-8') as f:
              content = f.read()
          match = re.search(r'(## 📌 \[v.*?\][\s\S]*?)(?=\n---\n|## 📌|\Z)', content)
          notes = match.group(1).strip() if match else 'WinPurify Pro automated build release'
          with open('RELEASE_BODY.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          "

      - name: Create GitHub Release (ahbiyout-all/WinPurify-Pro)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_notes.outputs.tag_name }}
          name: WinPurify Pro ${{ steps.release_notes.outputs.tag_name }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
