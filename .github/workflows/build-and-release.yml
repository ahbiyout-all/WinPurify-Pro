name: Windows Build & GitHub Release (Setup Installer Only)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g. v4.54.0)'
        required: false
        default: 'v4.54.0'

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Windows PC Official Setup Installer Build (Inno Setup Unpacked Setup.exe)
  # ============================================================================
  build-windows:
    name: Build Windows PC Official Setup Installer (WinPurifyPro-Setup.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK (8.0 LTS)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Node.js 20 is deprecated/EOL on GitHub Actions; using Node.js 22 LTS
      - name: Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify & Sync Versions Across Project
        run: node sync-version.js

      - name: Install Inno Setup Compiler
        run: choco install innosetup --yes --no-progress

      - name: Prepare Build Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "publish/App" -Force | Out-Null
          New-Item -ItemType Directory -Path "publish/Commander" -Force | Out-Null
          New-Item -ItemType Directory -Path "Output" -Force | Out-Null

      - name: Build Windows Application & Unpacked Assemblies
        shell: pwsh
        run: |
          Write-Host "==========================================================" -ForegroundColor Cyan
          Write-Host " Publishing Unpacked Multi-File Individual Assemblies" -ForegroundColor Green
          Write-Host "==========================================================" -ForegroundColor Cyan

          # Publish Ultra-Slim App & Commander
          dotnet publish WinPurifyPro.csproj -c Release -f net8.0-windows -r win-x64 --self-contained false -p:PublishSingleFile=false -p:DebugType=none -p:DebugSymbols=false -o publish/App
          dotnet publish WinPurifyCommander.csproj -c Release -f net8.0-windows -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -p:DebugSymbols=false -o publish/Commander

          # Copy core native engine and assets into publish/App
          @("PurifyEngineCore.dll", "WinPurify.ico", "WinPurify_logo.png", "WinPurify_icon.png", "LICENSE_KO.txt", "LICENSE_EN.txt") | ForEach-Object {
            if (Test-Path $_) { Copy-Item $_ -Destination "publish/App/" -Force }
          }
          if (Test-Path "publish/Commander/WinPurifyCommander.exe") {
            Copy-Item "publish/Commander/WinPurifyCommander.exe" -Destination "publish/App/WinPurifyCommander.exe" -Force
          }

          # Compile Official Unpacked Inno Setup Installer
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          
          Write-Host "[+] Compiling Official Inno Setup Installer: Output/WinPurifyPro-Setup.exe" -ForegroundColor Yellow
          & $iscc /DAppSourceDir="publish\App" /DOutputDir="Output" /DOutputBaseFilename="WinPurifyPro-Setup" installer.iss

      - name: Verify Windows Installer Size
        shell: pwsh
        run: |
          Get-ChildItem -Path "Output" | Select-Object Name, @{Name="Size(MB)";Expression={[math]::Round($_.Length / 1MB, 2)}}, LastWriteTime | Format-Table -AutoSize

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Output/WinPurifyPro-Setup.exe

  # ============================================================================
  # 2. Publish to GitHub Releases (Windows Installer Only)
  # ============================================================================
  publish-release:
    name: Publish Installer to GitHub Releases
    needs: [build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-installers

      - name: Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract Release Notes from PATCH_NOTES.md
        id: release_notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag_name=v${VERSION}" >> $GITHUB_OUTPUT
          python3 -c "
          import re
          with open('docs/PATCH_NOTES.md', 'r', encoding='utf-8') as f:
              content = f.read()
          match = re.search(r'(## 📌 \[v.*?\][\s\S]*?)(?=\n---\n|## 📌|\Z)', content)
          notes = match.group(1).strip() if match else 'WinPurify Pro automated build release'
          with open('RELEASE_BODY.md', 'w', encoding='utf-8') as out:
              out.write(notes)
          "

      - name: Create GitHub Release (Attach Windows Setup.exe Only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_notes.outputs.tag_name }}
          name: WinPurify Pro ${{ steps.release_notes.outputs.tag_name }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          files: release-installers/WinPurifyPro-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
